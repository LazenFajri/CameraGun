name: Build Windows PC Server

on:
  push:
    branches: [ main ]
    paths:
      - 'PC_Server/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Native Driver (.NET 8)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('PC_Server/PC_Server.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: |
          dotnet restore PC_Server/PC_Server.csproj

      - name: Publish Self-Contained Single-File Executable
        run: |
          dotnet publish PC_Server/PC_Server.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o PC_Server/publish

      - name: Bundle Release Package
        shell: pwsh
        run: |
          # Buat bundle zip berisi executable dan panduan cepat
          Copy-Item README.md -Destination PC_Server/publish/README.txt -ErrorAction SilentlyContinue
          Compress-Archive -Path PC_Server/publish/* -DestinationPath CameraGun-PC-Server-win-x64.zip -Force
          Write-Host "Bundle ZIP berhasil dibuat: CameraGun-PC-Server-win-x64.zip"

      - name: Upload Windows Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraGun-Windows-Server
          path: CameraGun-PC-Server-win-x64.zip
          if-no-files-found: error
          retention-days: 14
